<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datadog Mega Quest — All Features</title>
<meta name="theme-color" content="#003d5b">
<link rel="manifest" href="manifest.json">
<style>:root{--bg:#0e0e2a;--card:#1c1c3a;--txt:#eee}body.light{--bg:#f4f7fb;--card:#fff;--txt:#111}*{box-sizing:border-box;font-family:'Segoe UI',system-ui}body{margin:0;background:var(--bg);color:var(--txt)}header{background:linear-gradient(135deg,#003d5b,#00d4ff);padding:14px;text-align:center;color:#fff}nav{display:flex;gap:6px;justify-content:center;padding:10px;flex-wrap:wrap;background:#14143a;position:sticky;top:0;z-index:5}nav button{background:#2a2a5a;color:#fff;border:1px solid #5555aa;padding:8px 12px;border-radius:999px;font-weight:800;cursor:pointer;font-size:13px}nav button.active{background:#00a9e0;color:#00202e}#app{max-width:920px;margin:0 auto;padding:14px 12px 70px}.card{background:var(--card);border:1px solid #3a3a7a;border-radius:16px;padding:16px;margin:10px 0;color:var(--txt)}.btn{background:#00a9e0;color:#00202e;border:none;padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer;margin:4px 4px 0 0}.btn.sec{background:#2a2a5a;color:#fff}input,select,textarea{background:#2a2a5a;color:#fff;border:1px solid #5555aa;padding:8px;border-radius:8px;margin:4px;width:100%}body.light input,body.light select,body.light textarea{background:#eef;color:#111}.opts button{display:block;width:100%;text-align:left;margin:6px 0;background:#2a2a5a;color:#fff;border:1px solid #4a4ab0;padding:10px;border-radius:10px;cursor:pointer}body.light .opts button{background:#e8eefc;color:#111}.correct{background:#00c853!important}.wrong{background:#ff3d71!important}.bar{height:8px;background:#2a2a5a;border-radius:999px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#00d4ff,#7CFFB2)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #444;padding:6px;text-align:left}code{background:#0006;padding:2px 6px;border-radius:6px}body.light code{background:#dde}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style>
</head><body>
<header><h2 style="margin:0">🔭 MEGA QUEST <span id="ver" style="font-size:12px">v2-all-features</span></h2><div style="font-size:13px"><span id="who">…</span> | ⭐ <span id="xp">0</span> | 🔥<span id="streak">0</span> streak | <span id="lvl">Pup</span> | <span id="net">● local</span></div><div><button class="btn sec" onclick="toggleTheme()">🌗 Theme</button><select id="lang" onchange="setLang(this.value)" style="width:auto"><option value="en">EN</option><option value="zu">ZU</option><option value="af">AF</option><option value="fr">FR</option></select></div></header>
<nav><button id="b0" onclick="show(0)">👤 Players</button><button id="b1" onclick="show(1)">1️⃣ Cards</button><button id="b2" onclick="show(2)">2️⃣ Exam</button><button id="b3" onclick="show(3)">3️⃣ RPG</button><button id="b4" onclick="show(4)">⚡ Blitz</button><button id="b5" onclick="show(5)">📊 Paths</button></nav>
<div id="app"></div>
<script>
// ===== CORE STORE =====
const LS_U='ddq_users_v1',LS_C='ddq_current_v1',LS_FB='ddq_firebase_url_v1',LS_Q='ddq_queue_v1',LS_AN='ddq_analytics_v1',LS_WR='ddq_wrong_v1',LS_CUS='ddq_custom_v1';
const DEFAULT_FB='https://jb-custom-integrations-default-rtdb.firebaseio.com';
function fbURL(){return ((localStorage.getItem(LS_FB)||DEFAULT_FB)||'').replace(/\/$/,'');}
function loadJ(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}
function saveJ(k,v){localStorage.setItem(k,JSON.stringify(v));}
let users=loadJ(LS_U,{}),curName=localStorage.getItem(LS_C),curObj=curName?users[curName]:null;
let queue=loadJ(LS_Q,[]),analytics=loadJ(LS_AN,{}),wrongBank=loadJ(LS_WR,[]),customQ=loadJ(LS_CUS,[]);
function persist(){if(curName&&curObj){users[curName]=curObj;saveJ(LS_U,users);enqueueSave();}refresh();}
function refresh(){document.getElementById('xp').innerText=curObj?curObj.xp:0;document.getElementById('streak').innerText=curObj?(curObj.loginStreak||0):0;let xp=curObj?curObj.xp:0;document.getElementById('lvl').innerText=xp>=1200?'Legend':xp>=800?'SRE Hero':xp>=400?'Tracer':xp>=100?'Agent':'Pup';document.getElementById('who').innerText=curObj?`${curObj.avatar} ${curObj.name} (${curObj.team})`:'not signed in';}
// offline queue + auto-sync
async function enqueueSave(){if(!curObj)return;queue.push({...curObj,updatedAt:Date.now()});saveJ(LS_Q,queue.slice(-20));flush();}
async function flush(){const base=fbURL();if(!base||!navigator.onLine||!queue.length)return;try{for(let u of queue.splice(0,queue.length)){await fetch(`${base}/players/${encodeURIComponent(u.name)}.json`,{method:'PUT',body:JSON.stringify(u)});}saveJ(LS_Q,queue);document.getElementById('net').innerText='● online-synced';}catch{document.getElementById('net').innerText='● offline-queued('+queue.length+')';}}
window.addEventListener('online',flush);setInterval(flush,10000);
// realtime listener via EventSource (RTDB streaming)
let es=null;function listenRT(cb){try{if(es)es.close();const base=fbURL();if(!base)return;es=new EventSource(`${base}/players.json`);es.onmessage=e=>{if(e.data&&e.data!=='null'){try{cb(JSON.parse(e.data));}catch{}}};es.onerror=()=>{document.getElementById('net').innerText='● polling';};}catch{}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// i18n minimal
const I={en:{play:'Play',start:'Start',next:'Next →',known:'Knew it',review:'Review'},zu:{play:'Dlala',start:'Qala',next:'Okulandelayo →',known:'Bengikwazi',review:'Buyekeza'},af:{play:'Speel',start:'Begin',next:'Volgende →',known:'Ek het geweet',review:'Hersien'},fr:{play:'Jouer',start:'Commencer',next:'Suivant →',known:'Je savais',review:'Revoir'}};let LANG='en';function setLang(l){LANG=l;renderPlayers();}
function t(k){return (I[LANG]&&I[LANG][k])||I.en[k];}
// DATA
const CARDS=[["Monitoring vs Observability?","Monitoring: Is it working? reactive. Observability: Why? proactive. Monitoring ⊂ Observability."],["3 Pillars?","Metrics trends • Logs events • Traces path."],["Beyond pillars?","Profiles (function) + RUM (UX) + Events/changes (deploys)."],["Trace vs Span?","Trace journey (ID). Span unit (parent, duration)."],["Service vs Resource?","Service checkout-api. Resource POST /pay."],["Explorer vs Service?","Explorer live search. Service health/deps/deploys."],["Trace vs Profiler?","Trace WHICH SERVICE. Profiler WHICH LINE. Flame 8d."],["Sampling?","Head cheap, Tail keeps errors. Ingestion remote."],["Retention?","Keep 15d. Span-metrics → SLOs."],["Correlate?","Logs trace_id + RUM→trace + synth→trace + DBM."],["Watchdog?","Auto RCA. Error groups. Change overlays deploys."],["RUM vs Synth?","RUM real LCP/INP/CLS + replay. Synth proactive."],["SLO?","SLI metric, SLO 99.9%, budget=100-SLO. Multi-burn."],["OTel?","API/SDK/Collector/OTLP. Dynamic no-redeploy."],["Agent/AI?","LLM tokens/quality. Agent fan-out. Guard blocks injection."]];
const BASE_EXAM=[["p99?|Worst 1%|Average|Best|Price",0],["Apdex?|Satisfied ratio|Stock|Printer|Uptime",0],["Propagation?|W3C/B3 headers|Email|Copy|None",0],["Flame width?|Time widest=hottest|Height|Color|Random",0],["trace_id in logs?|Exact logs side-by-side|Nothing|Bills|Emails",0],["Cardinality danger?|Bill shock|Free|Safe|None",0],["DBM shows?|Query+waits+explain|Cafeteria|Nothing|Cache",0],["Service map?|Who calls whom|Org|Roads|None",0],["Noisy neighbor?|CPU steal+latency|Music|None|Human",0],["eBPF?|Kernel no-change|Nothing|Manual|Bills",0],["AI Guard?|Block injection|Physical|Garden|None",0],["Head vs tail?|Head start Tail full-trace smart|Same|Reverse|None",0],["SLO burn?|Fast+slow cuts noise|Single|None|Doors",0],["Serverless?|Lambda ext cold-start|Impossible|Mainframe|None",0],["Retention?|15d|15y|15s|0",0],["Thread-level?|Method/line/thread|Host only|Nothing|Disk",0],["Structured logs?|Facets|Grep|Unsearch|No",0],["RUM vitals?|LCP/INP/CLS|Uptime|Ping|Salary",0],["OTel parts?|API/SDK/Collector/OTLP|UI|DB|Logs",0],["GPU?|util/mem/throttle|CPU|None|Price",0]];
const CODE_Q=[["Trace JSON: trace_id same, parent null = ?|Root span|Child|Log|Metric",0],["Span duration 3800ms, child DB 3600ms → ?|DB bottleneck|Frontend|Network DNS|CPU idle",0],["Flame: widest frame checkout.authorize() → ?|Optimize that func|Ignore|Add hosts|Delete logs",0],["DQL: avg:trace.duration{env:prod,service:pay} by version → ?|Compare releases|Count users|List hosts|Bill",0],["Log pattern spike + deploy marker → ?|Likely deploy regression|Cosmic rays|Printer|Ignore",0],["p95 200ms p99 4s → ?|Tail outlier, check tail sampling/profiler|Fine|Avg fine|No issue",0],["Explain: Seq Scan on payments → ?|Missing index|Perfect|No DB|Cache",0],["SLO burn 14x fast window → ?|Page, freeze deploys|Ignore|More features|Delete SLO",0],["RUM LCP 5s + backend 200ms → ?|Frontend asset issue, check replay|Backend DB|Add DB|Add hosts",0],["Agent fan-out 12 tools, 1 retrieval slow → ?|Cache/fix that tool span|Scale all|Block AI|Nothing",0],["OTel span missing across service → ?|Propagator headers broken|No code|DB down|DNS",0],["Lock profile red → ?|Contention, reduce critical section|More CPU|More RAM|Ignore",0],["Custom metric cardinality 500k → ?|Drop high tags|Keep all|Add more|Ignore bill",0],["Synth fail 1 region only → ?|Regional/network, check NPM/DNS|Global outage|Code always|Ignore",0],["Mobile ANR + trace ok → ?|Main-thread block, need profiles|Backend|Network|Nothing",0],["K8s OOMKilled + latency → ?|Memory limit, check heap profile|CPU|Add nodes|Ignore",0],["Log: trace_id=abc error timeout → ?|Pivot to trace abc|Grep all|Delete|Restart",0],["Version compare v2.3 latency +30% → ?|Rollback/flag off + profile diff|Scale 10x|Add logs|Hope",0],["MCP tool error rate up → ?|Agent obs tool span + guard|Ignore|More tools|Less logs",0],["Watchdog outlier + change event → ?|Auto-RCA likely deploy|Manual only|Ignore|Delete",0]];
function fullPool(){let a=BASE_EXAM.map(s=>{let p=s.split('|'),q=p[0],o=p.slice(1),c=+o.pop();return{cat:'Tech',q,opts:o,a:c,e:'See docs + in-game explanation.'};});CODE_Q.forEach(s=>{let p=s.split('|'),q=p[0],o=p.slice(1),c=+o.pop();a.push({cat:'Code',q,opts:o,a:c,e:'Scenario reasoning.'});});customQ.forEach(c=>a.push(c));return a;}
// wrong bank + analytics
function recordResult(qid,ok){analytics[qid]=analytics[qid]||{n:0,ok:0};analytics[qid].n++;if(ok)analytics[qid].ok++;saveJ(LS_AN,analytics);if(!ok&&!wrongBank.includes(qid)){wrongBank.push(qid);saveJ(LS_WR,wrongBank.slice(-100));}}
// SCREENS
function show(n){['b0','b1','b2','b3','b4','b5'].forEach((id,i)=>document.getElementById(id).classList.toggle('active',i===n));if(n===0)renderPlayers();if(n===1)renderCards();if(n===2)renderExam();if(n===3)renderRPG();if(n===4)renderBlitz();if(n===5)renderPaths();}
function needLogin(){if(!curObj){show(0);return true;}return false;}
// players + teams + analytics + rules + csv
function renderPlayers(){
let names=Object.keys(users);
let teams={};names.forEach(n=>{let u=users[n];teams[u.team]=teams[u.team]||{xp:0,m:0};teams[u.team].xp+=u.xp;teams[u.team].m++;});
let teamRows=Object.entries(teams).sort((a,b)=>b[1].xp-a[1].xp).map(([k,v])=>`<tr><td>${k}</td><td>${v.xp}</td><td>${v.m}</td></tr>`).join('')||'<tr><td colspan=3>No teams yet</td></tr>';
let rows=names.map(n=>{let u=users[n];return `<tr><td>${u.avatar} ${u.name}</td><td>${u.team}</td><td>${u.xp}</td><td>${u.badges.length}</td><td>${u.bestExam||'-'}</td><td>${u.bestRPG||'-'}</td><td><button class="btn sec" onclick="login('${n.replace(/'/g,"\\'")}')">${t('play')}</button></td></tr>`}).join('')||'<tr><td colspan=7>No players</td></tr>';
document.getElementById('app').innerHTML=`<div class="card"><h2>👤 Onboarding (local + online auto-sync + offline queue)</h2><div id="onstat">DB: ${fbURL()} | queue ${queue.length} | <span id="live">live: connecting…</span></div>
<input id="nm" placeholder="Name"><input id="tm" placeholder="Team (auto team board)"><select id="av"><option>🐶</option><option>🦊</option><option>🐼</option><option>🚀</option></select>
<button class="btn" onclick="onboard()">➕ ${t('start')}</button>
<div class="grid"><div><h3>🏆 Local</h3><table><tr><th>Player</th><th>Team</th><th>XP</th><th>🎖</th><th>Exam</th><th>RPG</th><th></th></tr>${rows}</table></div><div><h3>⚔️ Team battles</h3><table><tr><th>Team</th><th>XP</th><th>Members</th></tr>${teamRows}</table><h3>🌐 Online Top (live)</h3><div id="onb"><button class="btn sec" onclick="loadOB()">Load</button></div></div></div>
<div class="card"><b>📦 Question packs (CSV → reach 200+)</b><br>Format: <code>cat,question,opt1|opt2|opt3,answerIdx,explain</code><textarea id="csv" rows="3" placeholder="Code,What is p99?,Avg|Worst1%|Best,1,Tail"></textarea><button class="btn" onclick="importCSV()">Import CSV</button><button class="btn sec" onclick="exportCSV()">Export CSV</button><span> Pool now: ${fullPool().length} (base ${BASE_EXAM.length+CODE_Q.length} + custom ${customQ.length})</span></div>
<div class="card"><b>🔒 Secure RTDB rules (paste in Firebase → Rules)</b><pre style="white-space:pre-wrap;font-size:12px">{"rules":{"players":{".read":true,"$n":{".write":true,".validate":"newData.hasChildren(['name','xp']) && newData.child('xp').val() < 100000"}},"analytics":{".read":true,".write":true}}}</pre><b>📊 Analytics (hardest)</b><div id="an">${analyticsHTML()}</div><button class="btn sec" onclick="resetWrong()">Reset wrong-bank (${wrongBank.length})</button></div>
</div>`;
listenRT(d=>{let el=document.getElementById('onb');if(el){let arr=Object.values(d).sort((a,b)=>b.xp-a.xp).slice(0,10);el.innerHTML=arr.map((u,i)=>`${i+1}. ${u.avatar} ${u.name} ${u.xp}XP`).join('<br>');}let l=document.getElementById('live');if(l)l.textContent='live: '+Object.keys(d).length+' players';});
}
function analyticsHTML(){let e=Object.entries(analytics).map(([k,v])=>({k,acc:v.ok/v.n,n:v.n})).sort((a,b)=>a.acc-b.acc).slice(0,5);if(!e.length)return 'No data yet — play exam/blitz.';return e.map(x=>`${x.k}: ${Math.round(x.acc*100)}% (${x.n} tries)`).join('<br>');}
async function loadOB(){try{let r=await fetch(`${fbURL()}/players.json`);let d=await r.json();let arr=Object.values(d||{}).sort((a,b)=>b.xp-a.xp).slice(0,10);document.getElementById('onb').innerHTML=arr.map((u,i)=>`${i+1}. ${u.avatar} ${u.name} ${u.xp}XP`).join('<br>');}catch{document.getElementById('onb').innerText='offline';}}
function onboard(){let n=(document.getElementById('nm').value||'Player1').trim(),tm=(document.getElementById('tm').value||'Solo').trim(),a=document.getElementById('av').value;if(!users[n])users[n]={name:n,team:tm,avatar:a,xp:0,badges:[],fc:0,bestExam:0,bestRPG:0,loginStreak:1,lastDay:new Date().toDateString(),history:[]};let today=new Date().toDateString();if(users[n].lastDay!==today){let y=new Date(Date.now()-864e5).toDateString();users[n].loginStreak=(users[n].lastDay===y)?(users[n].loginStreak||0)+1:1;users[n].lastDay=today;}saveJ(LS_U,users);localStorage.setItem(LS_C,n);curName=n;curObj=users[n];persist();show(1);}
function login(n){localStorage.setItem(LS_C,n);curName=n;curObj=users[n];refresh();show(1);}
function importCSV(){let v=document.getElementById('csv').value.trim().split('\n');v.forEach(line=>{let p=line.split(',');if(p.length<5)return;let cat=p[0],q=p[1],opts=p[2].split('|'),a=+p[3],e=p.slice(4).join(',');customQ.push({cat,q,opts,a,e});});saveJ(LS_CUS,customQ);alert('Imported! Pool='+fullPool().length);}
function exportCSV(){let s=customQ.map(c=>`${c.cat},${c.q},${c.opts.join('|')},${c.a},${c.e}`).join('\n');let b=new Blob([s],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pack.csv';a.click();}
function resetWrong(){wrongBank=[];saveJ(LS_WR,[]);renderPlayers();}
// cards + exam + blitz share helper
let ci=0;function renderCards(){if(needLogin())return;document.getElementById('app').innerHTML=`<div class="card"><h2>Cards ${Math.min(ci+1,15)}/15</h2><div class="flashcard" onclick="this.classList.toggle('flip')" style="perspective:800px;cursor:pointer"><div class="flash-inner" style="position:relative;height:180px;transform-style:preserve-3d;transition:.5s" id="fi"><div style="position:absolute;width:100%;height:100%;backface-visibility:hidden;background:#2c2c6e;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:16px"><b>${CARDS[ci%15][0]}</b></div></div></div><p>${CARDS[ci%15][1]}</p><p>📖 Trace/span diagram: <code>[Browser]→[checkout]→[auth]→[postgres]</code> | Flame: <code>width=time</code> | Docs: docs.datadoghq.com/tracing + /profiler</p><button class="btn" onclick="mark(true)">✅ ${t('known')} +20</button><button class="btn sec" onclick="mark(false)">${t('review')}</button></div>`;}
// expand flash flip css quick
const st=document.createElement('style');st.innerHTML='.flashcard.flip .flash-inner{transform:rotateY(180deg)}';document.head.appendChild(st);
function mark(k){if(k&&curObj){curObj.xp+=20;curObj.fc=Math.min(15,(curObj.fc||0)+1);if(curObj.fc===5)alert('⚡ Fast Learner');}persist();ci++;if(ci>=15){document.getElementById('app').innerHTML='<div class="card"><h2>Done!</h2><button class="btn" onclick="ci=0;renderCards()">Replay</button></div>';return;}renderCards();}
let ei=0,es=0,et=null,etl=600,curQ=null;
function renderExam(){if(needLogin())return;document.getElementById('app').innerHTML=`<div class="card"><h2>Exam 20Q 10:00 + hints (Best ${curObj.bestExam||0})</h2><button class="btn" onclick="startExam(false)">Start</button> <button class="btn sec" onclick="startExam(true)">Boss rematch (misses ${wrongBank.length})</button><div>Paths: Fundamentals→APM→Profiler→RUM→SLO track in Paths tab.</div></div>`;}
function startExam(boss){let pool=shuffle(fullPool());if(boss){let w=pool.filter((_,i)=>wrongBank.includes('q'+i));if(w.length)pool=w.concat(pool).slice(0,20);}else pool=pool.slice(0,20);ei=0;es=0;etl=600;window._pool=pool;clearInterval(et);et=setInterval(()=>{etl--;let el=document.getElementById('tm');if(el)el.innerText=Math.floor(etl/60)+':'+String(etl%60).padStart(2,'0');if(etl<=0)finishExam();},1000);showEQ();}
function showEQ(){let pool=window._pool;if(ei>=pool.length){finishExam();return;}curQ=pool[ei];let ord=curQ.opts.map((_,i)=>i);shuffle(ord);curQ._o=ord.map(i=>curQ.opts[i]);curQ._a=ord.indexOf(curQ.a);document.getElementById('app').innerHTML=`<div class="card"><h3>Q${ei+1}/20 [${curQ.cat}] ${curQ.q}</h3><div>⏱ <span id="tm"></span> Score ${es}</div><div class="opts">${curQ._o.map((o,i)=>`<button id="ob${i}" onclick="ansE(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><button class="btn sec" onclick="hint5050()">50/50 -10XP</button> <button class="btn sec" onclick="hintShow()">Reveal -10XP</button><div id="fb"></div></div>`;}
function ansE(i){let ok=i===curQ._a;recordResult('q'+ei,ok);if(ok){es++;curObj.xp+=50;}else{wrongBank.push('q'+ei);saveJ(LS_WR,wrongBank);}persist();ei++;showEQ();}
function hint5050(){if(curObj.xp<10){alert('Need 10XP');return;}curObj.xp-=10;persist();let wrongs=curQ._o.map((_,i)=>i).filter(i=>i!==curQ._a).slice(0,2);wrongs.forEach(i=>{let b=document.getElementById('ob'+i);if(b)b.style.opacity=.3;});}
function hintShow(){if(curObj.xp<10){alert('Need 10XP');return;}curObj.xp-=10;persist();document.getElementById('fb').innerHTML='Answer: '+curQ._o[curQ._a];}
function finishExam(){clearInterval(et);if(es>(curObj.bestExam||0))curObj.bestExam=es;persist();document.getElementById('app').innerHTML=`<div class="card"><h2>${es}/20 Best ${curObj.bestExam}</h2><button class="btn" onclick="renderExam()">Retake</button></div>`;}
// RPG 5
const RPG=[{t:"02:14 p99 spike",x:"v2.3 20m ago?",o:["Service+Change","Restart","Mute","Scale"],g:0},{t:"90% postgres 3.8s",x:"US hit EU fine?",o:["Span→logs+DBM+Profiles","Blame net","Rollback","Timeout"],g:0},{t:"N+1 + missing idx",x:"12k=1 issue?",o:["Flag off+index","Drop","Scale 1000","Nothing"],g:0},{t:"Flaky synth+ANR",x:"?",o:["SLO+replay+maps","More dash","Disable","Hope"],g:0},{t:"BONUS AI 12 tools",x:"Guardrails?",o:["Agent obs+Guard+GPU","Log","No obs","Block"],g:0}];
let ri=0,rs=0;function renderRPG(){if(needLogin())return;ri=0;rs=0;showRPG();}
function showRPG(){if(ri>=RPG.length){if(rs>(curObj.bestRPG||0))curObj.bestRPG=rs;persist();document.getElementById('app').innerHTML=`<div class="card"><h2>RPG ${rs}/900 Best ${curObj.bestRPG}</h2><button class="btn" onclick="renderRPG()">Replay</button></div>`;return;}let s=RPG[ri];document.getElementById('app').innerHTML=`<div class="card"><h2>${s.t} (${ri+1}/5)</h2><p>${s.x}</p><div class="opts">${s.o.map((o,i)=>`<button onclick="rpgA(${i})">${o}</button>`).join('')}</div><div id="rf"></div></div>`;}
function rpgA(i){let pts=[100,150,200,200,250][ri];if(i===RPG[ri].g){rs+=pts;curObj.xp+=pts;persist();document.getElementById('rf').innerHTML=`✅ <button class="btn" onclick="ri++;showRPG()">${t('next')}</button>`;}else document.getElementById('rf').innerHTML='❌ Try again';}
// blitz
let bi=0,bs=0,bt=60,bTimer=null,combo=0;
function renderBlitz(){if(needLogin())return;document.getElementById('app').innerHTML=`<div class="card"><h2>⚡ Blitz 60s — combo x2 after 3 streak</h2><p>Best stored in history. Pool ${fullPool().length}.</p><button class="btn" onclick="startBlitz()">Go</button></div>`;}
function startBlitz(){bi=0;bs=0;bt=60;combo=0;window._b=shuffle(fullPool());clearInterval(bTimer);bTimer=setInterval(()=>{bt--;let el=document.getElementById('bt');if(el)el.innerText=bt;if(bt<=0){clearInterval(bTimer);curObj.xp+=bs;persist();document.getElementById('app').innerHTML=`<div class="card"><h2>Blitz ${bs}pts</h2><button class="btn" onclick="renderBlitz()">Again</button></div>`;}},1000);showB();}
function showB(){let q=window._b[bi%window._b.length];curQ=q;let ord=q.opts.map((_,i)=>i);shuffle(ord);q._o=ord.map(i=>q.opts[i]);q._a=ord.indexOf(q.a);document.getElementById('app').innerHTML=`<div class="card"><h3>⏱ <span id="bt">${bt}</span>s | ${bs}pts | combo ${combo}</h3><p>${q.q}</p><div class="opts">${q._o.map((o,i)=>`<button onclick="ansB(${i})">${o}</button>`).join('')}</div></div>`;}
function ansB(i){let pts=10;if(i===curQ._a){combo++;if(combo>=3)pts=20;bs+=pts;}else combo=0;bi++;showB();}
// paths
function renderPaths(){if(needLogin())return;let paths=[['Fundamentals',['Fundamentals']],['APM Tracing',['APM','Tech']],['Profiler',['Profiler']],['RUM/Synth',['RUM']],['SLO/Incident',['SLO']]];document.getElementById('app').innerHTML='<div class="card"><h2>📊 Learning paths</h2>'+paths.map(p=>`<div><b>${p[0]}</b><div class="bar"><div style="width:${Math.min(100,(curObj.xp/1200*100))}%"></div></div></div>`).join('')+'<p>XP '+curObj.xp+'/1200 to Legend. Wrong-bank '+wrongBank.length+' due. Custom '+customQ.length+'.</p><button class="btn" onclick="show(1)">Review wrong-bank</button></div>';}
function toggleTheme(){document.body.classList.toggle('light');}
refresh();show(0);
</script></body></html>
