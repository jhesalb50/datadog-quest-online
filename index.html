<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datadog Tech Quest — With Player Progress</title>
<style>*{box-sizing:border-box;font-family:'Segoe UI',system-ui}body{margin:0;background:#0e0e2a;color:#eee}header{background:linear-gradient(135deg,#003d5b,#00d4ff);padding:18px;text-align:center;color:#fff}nav{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap;background:#14143a;position:sticky;top:0;z-index:5}nav button{background:#2a2a5a;color:#fff;border:1px solid #5555aa;padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer}nav button.active{background:#00a9e0;color:#00202e}#app{max-width:860px;margin:0 auto;padding:16px 14px 70px}.card{background:#1c1c3a;border:1px solid #3a3a7a;border-radius:16px;padding:18px;margin:12px 0}.btn{background:#00a9e0;color:#00202e;border:none;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer;margin:6px 6px 0 0}.btn.sec{background:#2a2a5a;color:#fff}input,select{background:#2a2a5a;color:#fff;border:1px solid #5555aa;padding:10px;border-radius:10px;margin:4px;width:100%}.flashcard{height:230px;perspective:1000px;cursor:pointer}.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.flashcard.flip .flash-inner{transform:rotateY(180deg)}.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:20px;font-size:17px;text-align:center;line-height:1.5}.front{background:#2c2c6e;border:2px solid #00d4ff}.back{background:#0e5a4a;border:2px solid #00e5a0;transform:rotateY(180deg)}.opts button{display:block;width:100%;text-align:left;margin:8px 0;background:#2a2a5a;color:#fff;border:1px solid #4a4ab0;padding:12px;border-radius:12px;cursor:pointer}.correct{background:#00c853!important}.wrong{background:#ff3d71!important}.timer{font-size:20px;font-weight:900;color:#ffd54d}.bar{height:10px;background:#2a2a5a;border-radius:999px;overflow:hidden;margin:6px 0}.bar>div{height:100%;background:linear-gradient(90deg,#00d4ff,#7CFFB2)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #444;padding:8px;text-align:left}th{background:#2f2f6b}</style>
</head><body>
<header><h1 style="margin:0">🔭 DATADOG TECH QUEST</h1><p style="margin:4px">100% Technical • <span id="who">Not signed in</span></p><div>⭐ <span id="xp">0</span> XP | 🏅 <span id="bd">0</span> | 🎯 <span id="lvl">Pup</span></div></header>
<nav><button id="b0" onclick="show(0)">👤 Players</button><button id="b1" onclick="show(1)">1️⃣ Flashcards (15)</button><button id="b2" onclick="show(2)">2️⃣ Hard Exam (20)</button><button id="b3" onclick="show(3)">3️⃣ SRE RPG (5)</button></nav>
<div id="app"></div>
<script>
// ===== STORAGE + ONLINE (Firebase RTDB, no-auth demo mode) =====
const LS_USERS='ddq_users_v1', LS_CUR='ddq_current_v1', LS_FB='ddq_firebase_url_v1';
function fbURL(){return (localStorage.getItem(LS_FB)||'').trim().replace(/\/$/,'');}
async function syncOnline(){try{const base=fbURL();if(!base||!curObj)return;await fetch(`${base}/players/${encodeURIComponent(curObj.name)}.json`,{method:'PUT',body:JSON.stringify({...curObj,updatedAt:Date.now()})});}catch(e){console.log('sync offline',e);}}
async function fetchOnline(){try{const base=fbURL();if(!base)return null;const r=await fetch(`${base}/players.json`);if(!r.ok)return null;return await r.json();}catch{return null;}}
function loadUsers(){try{return JSON.parse(localStorage.getItem(LS_USERS)||'{}')}catch{return{}}}
function saveUsers(u){localStorage.setItem(LS_USERS,JSON.stringify(u));}
function cur(){return localStorage.getItem(LS_CUR);}
function setCur(n){localStorage.setItem(LS_CUR,n);}
function getUser(){let u=loadUsers(),c=cur();return c&&u[c]?u[c]:null;}
function persist(){let u=loadUsers(),c=cur();if(c&&curObj){u[c]=curObj;saveUsers(u);syncOnline();}}
let curObj=getUser();
function refreshHeader(){document.getElementById('xp').innerText=curObj?curObj.xp:0;document.getElementById('bd').innerText=curObj?curObj.badges.length:0;let xp=curObj?curObj.xp:0;document.getElementById('lvl').innerText=xp>=1200?'Legend':xp>=800?'SRE Hero':xp>=400?'Tracer':'Pup';document.getElementById('who').innerText=curObj?`${curObj.avatar} ${curObj.name} (${curObj.team})`:'Not signed in';}
function addXP(n){if(!needLogin())return;curObj.xp+=n;curObj.history.push({t:Date.now(),xp:n});persist();refreshHeader();}
function addBadge(t){if(!curObj||curObj.badges.includes(t))return;curObj.badges.push(t);persist();refreshHeader();alert('🏅 '+t);}
function needLogin(){if(!curObj){show(0);alert('👤 Onboard first — enter name to save progress!');return true;}return false;}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// ===== DATA (same 15+20+5) =====
const CARDS=[["Monitoring vs Observability?","Monitoring: Is it working? reactive. Observability: Why? proactive. Monitoring ⊂ Observability."],["3 Pillars?","Metrics (trends) • Logs (events) • Traces (path/latency)."],["Beyond pillars?","Profiles (function) + RUM sessions (UX) + Events/changes (deploys)."],["Trace vs Span?","Trace = journey (trace ID). Span = one unit (parent ID, duration, tags)."],["Service vs Resource?","Service = checkout-api. Resource = POST /pay."],["Explorer vs Service Page?","Explorer = live search. Service Page = health/deps/deploys + version compare."],["Trace vs Profiler?","Trace = WHICH SERVICE. Profiler = WHICH FUNCTION/LINE. Flame 8d."],["Head vs tail sampling?","Head at start (cheap). Tail after full trace (keeps errors). Ingestion Controls remote."],["Retention?","Keep chosen spans 15 days. Span-metrics → SLOs from any tag."],["Correlate APM with?","Logs (trace_id) + RUM→trace + synthetics→trace + DBM + network + profiles."],["Watchdog/Error/Change?","Watchdog auto RCA. Error groups issues. Change overlays deploys/flags."],["RUM vs Synthetics?","RUM real users LCP/INP/CLS + replay. Synthetics proactive checks. Replay→trace."],["SLI/SLO/Burn?","SLI metric, SLO 99.9%, budget=100-SLO. Multi-window burn cuts noise."],["OTel?","API/SDK/Collector/OTLP. Hybrid OK. Dynamic Instrumentation no redeploy. Tags env/svc/version."],["LLM/Agent?","LLM tokens/cost/quality. Agent tool fan-out. AI Guard blocks injection. GPU util."]];
const EXAM=[["High-cardinality enables?|Slicing by user/version/endpoint|Only totals|Nothing|Less data",0],["p99 means?|Worst 1% latency|Average|Best|Price",0],["Apdex?|Satisfied/tolerated/frustrated ratio|Stock|Printer|Uptime",0],["Context propagation?|Trace headers W3C/B3|Email|Copy|None",0],["Custom instrumentation when?|Manual spans/tags/control|Never|Hello-world|Static",0],["Serverless?|Auto Lambda/Azure ext|Impossible|Mainframe|None",0],["Thread-level shows?|Method/line/thread time|Host only|Nothing|Disk",0],["Flame width?|Time, widest=hottest|Height=cost|Color=price|Random",0],["Profile types?|CPU, heap, lock, IO|Only CPU|Salary|Disk",0],["Lock contention?|Wall+lock profiles blocked threads|CPU only|Never|Network",0],["Structured logs?|Query facets service/version/user|Grep|Unsearch|No win",0],["trace_id in logs?|Exact request logs side-by-side|Nothing|Bills|Emails",0],["Custom metrics danger?|Cardinality explosion bill|Free|No cost|Safe",0],["Log cost control?|Ingest all, index valuable, archive|Index all free|Delete|Print",0],["DBM in span?|Query+waits+explain/missing index|Cafeteria|Nothing|Cache",0],["Service map?|Who calls whom + health|Org chart|Roads|Nothing",0],["Noisy neighbor?|Host steal + latency infra+APM|Loud music|No effect|Human",0],["Multi-window burn?|Fast+slow cuts false positives|Single|No windows|Doors",0],["eBPF?|Kernel observe no code change|Nothing|Manual|Bills",0],["AI Guard?|Block injection/poisoning|Physical|Garden|Nothing",0]];
const RPG=[{title:"🌙 02:14 — p99 800ms→4.2s",text:"Error 1%→8%. v2.3 20m ago. First?",opts:["Service Page + Change + Watchdog","Restart random","Mute + sleep","Scale 10x"],good:0,win:"+100 — aligns with v2.3.",lose:"MTTR +15m! Check deploys."},{title:"🔍 90% in postgres.authorize 3.8s",text:"US hit EU fine. Next?",opts:["Span→logs+DBM+Profiles","Blame network","Rollback blind","Timeout 30s"],good:0,win:"+150 — deadlock, missing index line 214 N+1.",lose:"Need evidence!"},{title:"🧪 12k errors = 1 issue",text:"N+1 + missing index. Fix?",opts:["Flag OFF + index, version compare","Drop table","Scale 1000","Nothing"],good:0,win:"+200 — p99 750ms in 6m.",lose:"$$$ blind scale!"},{title:"🛡️ Flaky synthetics + ANRs",text:"Intermittent fails. Proposal?",opts:["SLO burn + retries + replay→trace + source maps","More dashboards","Disable RUM","Hope"],good:0,win:"+200 — race pinned.",lose:"Repeats!"},{title:"🤖 BONUS — AI agent 12 tools",text:"Quality down cost up. Guardrails?",opts:["Agent Obs (fan-out/tokens) + AI Guard + GPU + eval SLO","Console log","No obs","Block AI"],good:0,win:"+250 — bad retrieval traced! Commander!",lose:"Hallucinates refunds!"}];
// ===== SCREENS =====
let ci=0,ei=0,escore=0,tleft=600,timer=null,ri=0,rs=0;
function show(n){['b0','b1','b2','b3'].forEach((id,i)=>document.getElementById(id).classList.toggle('active',i===n));if(n===0)renderPlayers();if(n===1){if(needLogin())return;ci=curObj.fc||0;renderCards();}if(n===2){if(needLogin())return;renderExam();}if(n===3){if(needLogin())return;renderRPG();}}
function renderPlayers(){
let users=loadUsers();let names=Object.keys(users);
let rows=names.map(n=>{let u=users[n];return `<tr><td>${u.avatar} ${u.name}</td><td>${u.team}</td><td>${u.xp}</td><td>${u.badges.length}</td><td>${u.bestExam||'-'}/20</td><td>${u.bestRPG||'-'}/900</td><td><button class="btn sec" onclick="login('${n.replace(/'/g,"\\'")}')">Play</button></td></tr>`}).join('')||'<tr><td colspan=7>No players yet — onboard below!</td></tr>';
document.getElementById('app').innerHTML=`<div class="card"><h2>👤 Player Onboarding</h2><p>Progress saves in this browser (localStorage) per player. Switch devices? Export JSON.</p>
<input id="nm" placeholder="Name (e.g. Thabo)"><input id="tm" placeholder="Team (e.g. SRE / Study Group A)">
<select id="av"><option>🐶</option><option>🦊</option><option>🐼</option><option>🦁</option><option>👩‍💻</option><option>👨‍💻</option><option>🚀</option></select>
<button class="btn" onclick="onboard()">➕ Create / Login & Save Progress</button>
<button class="btn sec" onclick="exportJSON()">⬇ Export my progress</button> <input type="file" id="imp" accept=".json" onchange="importJSON(event)">
<div style="background:#0b3b4d;padding:12px;border-radius:10px;margin-top:10px"><b>🌐 Online platform (shared leaderboard)</b><br>1) Create free DB: <code>console.firebase.google.com → Realtime Database → Create → test mode</code><br>2) Copy Database URL like <code>https://xxx-default-rtdb.firebaseio.com</code><br><input id="fb" placeholder="https://YOUR-PROJECT-default-rtdb.firebaseio.com" value=""><div><button class="btn" onclick="saveFB()">🔗 Connect & Sync</button> <button class="btn sec" onclick="loadOnlineBoard()">↻ Load online board</button></div><div id="onstat" style="font-size:13px;opacity:.9">Status: local-only until connected.</div><div id="onboard"></div></div>
<h3>🏆 Leaderboard (${names.length} players)</h3><table><tr><th>Player</th><th>Team</th><th>XP</th><th>Badges</th><th>Best Exam</th><th>Best RPG</th><th></th></tr>${rows}</table>
${curObj?`<button class="btn sec" onclick="logout()">Logout ${curObj.name}</button> <button class="btn sec" onclick="wipe()">Reset my progress</button>`:''}
</div>`;
refreshHeader();
}
function onboard(){let n=document.getElementById('nm').value.trim()||'Player1',t=document.getElementById('tm').value.trim()||'Solo',a=document.getElementById('av').value;let u=loadUsers();if(!u[n])u[n]={name:n,team:t,avatar:a,xp:0,badges:[],fc:0,bestExam:0,bestRPG:0,history:[]};saveUsers(u);setCur(n);curObj=u[n];persist();refreshHeader();alert(`Welcome ${a} ${n}! Progress will auto-save.`);show(1);}
function login(n){setCur(n);curObj=loadUsers()[n];refreshHeader();show(1);}
function logout(){localStorage.removeItem(LS_CUR);curObj=null;refreshHeader();renderPlayers();}
function wipe(){if(confirm('Reset progress?')){curObj.xp=0;curObj.badges=[];curObj.fc=0;curObj.bestExam=0;curObj.bestRPG=0;curObj.history=[];persist();refreshHeader();renderPlayers();}}
function saveFB(){let v=document.getElementById('fb').value.trim();localStorage.setItem(LS_FB,v);document.getElementById('onstat').innerText='Status: connected to '+v;syncOnline();loadOnlineBoard();}
async function loadOnlineBoard(){let data=await fetchOnline();let el=document.getElementById('onboard');if(!el)return;if(!data){el.innerHTML='<i>No online data yet (check URL + rules).</i>';return;}let arr=Object.values(data).sort((a,b)=>b.xp-a.xp).slice(0,20);el.innerHTML='<h3>🌐 Online Top 20</h3><table><tr><th>#</th><th>Player</th><th>XP</th><th>Exam</th><th>RPG</th></tr>'+arr.map((u,i)=>`<tr><td>${i+1}</td><td>${u.avatar||'🐶'} ${u.name}</td><td>${u.xp}</td><td>${u.bestExam||'-'}</td><td>${u.bestRPG||'-'}</td></tr>`).join('')+'</table>';}
function exportJSON(){let blob=new Blob([JSON.stringify(curObj,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=curObj.name+'-datadog-progress.json';a.click();}
function importJSON(e){let f=e.target.files[0];let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);let u=loadUsers();u[o.name]=o;saveUsers(u);setCur(o.name);curObj=o;refreshHeader();alert('Imported!');show(0);}catch{alert('Bad file')}};r.readAsText(f);}
function renderCards(){document.getElementById('app').innerHTML=`<div class="card"><h2>1️⃣ Flashcards ${Math.min(ci+1,15)}/15 — ${curObj.name}</h2><div class="bar"><div style="width:${ci/15*100}%"></div></div><div class="flashcard" onclick="this.classList.toggle('flip')"><div class="flash-inner"><div class="face front"><b>${CARDS[ci%15][0]}</b></div><div class="face back">${CARDS[ci%15][1]}</div></div></div><div><button class="btn" onclick="mark(true)">✅ Knew it (+20)</button><button class="btn sec" onclick="mark(false)">🔁 Review</button></div></div>`;}
function mark(k){if(k){addXP(20);curObj.fc=Math.min(15,(curObj.fc||0)+1);if(curObj.fc===5)addBadge('⚡ Fast Learner');if(curObj.fc>=15)addBadge('🧠 APM Brain');}persist();ci++;if(ci>=15){document.getElementById('app').innerHTML=`<div class="card"><h2>Deck done! Saved ✅ Best: ${curObj.fc}/15</h2><button class="btn" onclick="ci=0;renderCards()">🔄 Replay (keeps XP)</button></div>`;return;}renderCards();}
function renderExam(){clearInterval(timer);document.getElementById('app').innerHTML=`<div class="card"><h2>2️⃣ Hard Exam 20Q • 10:00 — ${curObj.name}</h2><p>Best: ${curObj.bestExam||0}/20</p><div class="timer">⏱ <span id="t">10:00</span></div><button class="btn" onclick="startExam()">▶ Start (saves best)</button></div>`;}
function startExam(){ei=0;escore=0;tleft=600;clearInterval(timer);timer=setInterval(()=>{tleft--;let el=document.getElementById('t');if(el)el.innerText=`${Math.floor(tleft/60)}:${String(tleft%60).padStart(2,'0')}`;if(tleft<=0)finishExam();},1000);showQ();}
function showQ(){if(ei>=EXAM.length){finishExam();return;}let p=EXAM[ei].split('|'),q=p[0],opts=p.slice(1),c=+opts.pop();let ord=opts.map((_,i)=>i);shuffle(ord);let no=ord.map(i=>opts[i]),na=ord.indexOf(c);document.getElementById('app').innerHTML=`<div class="card"><h3>Q${ei+1}/20: ${q}</h3><div class="timer">⏱ <span id="t">${Math.floor(tleft/60)}:${String(tleft%60).padStart(2,'0')}</span></div><div class="opts">${no.map((o,i)=>`<button onclick="ans(${i},${na})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div></div>`;}
function ans(i,c){if(i===c){escore++;addXP(50);}ei++;showQ();}
function finishExam(){clearInterval(timer);if(escore>(curObj.bestExam||0)){curObj.bestExam=escore;if(escore>=18)addBadge('🎓 Exam Legend');persist();}document.getElementById('app').innerHTML=`<div class="card"><h2>${escore}/20 — Best ${curObj.bestExam}/20 — Saved ✅</h2><button class="btn" onclick="renderExam()">🔄 Retake</button></div>`;}
function renderRPG(){ri=0;rs=0;showRPG();}
function showRPG(){if(ri>=RPG.length){if(rs>(curObj.bestRPG||0)){curObj.bestRPG=rs;if(rs>=800)addBadge('🚒 Incident Commander');persist();}document.getElementById('app').innerHTML=`<div class="card"><h2>🏁 ${rs}/900 — Best ${curObj.bestRPG} — Saved ✅</h2><button class="btn" onclick="renderRPG()">🔄 New incident</button></div>`;return;}let s=RPG[ri];document.getElementById('app').innerHTML=`<div class="card"><h2>${s.title} (${ri+1}/5) — ${curObj.name}</h2><p>${s.text}</p><div class="opts">${s.opts.map((o,i)=>`<button onclick="rpgA(${i})">${o}</button>`).join('')}</div><div id="rf"></div></div>`;}
function rpgA(i){let s=RPG[ri],pts=[100,150,200,200,250][ri];if(i===s.good){rs+=pts;addXP(pts);document.getElementById('rf').innerHTML=`<p style="color:#00e5a0">✅ ${s.win}</p><button class="btn" onclick="ri++;showRPG()">Continue →</button>`;}else{document.getElementById('rf').innerHTML=`<p style="color:#ff6b9d">❌ ${s.lose} Try again.</p>`;}}
refreshHeader();renderPlayers();
</script></body></html>
